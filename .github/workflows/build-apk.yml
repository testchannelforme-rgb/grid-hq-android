name: Build GridHQ APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, ai-development]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      GRIDHQ_KEYSTORE_PASSWORD: ${{ secrets.GRIDHQ_KEYSTORE_PASSWORD }}
      GRIDHQ_KEY_ALIAS: ${{ secrets.GRIDHQ_KEY_ALIAS }}
      GRIDHQ_KEY_PASSWORD: ${{ secrets.GRIDHQ_KEY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q MonopostoChampionshipManager_COMPLETE.zip -d extracted
          rm -f extracted/GridHQ/gradle/wrapper/gradle-wrapper.jar
          if [ -f patches/NavigationRegressionTest.kt ]; then
            cp patches/NavigationRegressionTest.kt \
              extracted/GridHQ/app/src/androidTest/java/com/monoposto/championship/NavigationRegressionTest.kt
            echo "Applied NavigationRegressionTest patch"
          else
            echo "::warning::patches/NavigationRegressionTest.kt not found — instrumented tests may fail"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configure optional existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDHQ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDHQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GRIDHQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GRIDHQ_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || \
               [ -z "$KEY_ALIAS" ] || \
               [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Keystore was supplied, but one or more signing secrets are missing."
              exit 1
            fi

            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/gridhq.keystore"

            echo "GRIDHQ_KEYSTORE_PATH=$RUNNER_TEMP/gridhq.keystore" \
              >> "$GITHUB_ENV"

            echo "Existing signing key configured."
          else
            echo "::warning::No existing signing key supplied. The debug APK will use the automatically generated debug signing key."
          fi

      - name: Generate Gradle wrapper
        working-directory: extracted/GridHQ
        shell: bash
        run: |
          gradle --no-daemon wrapper \
            --gradle-version 8.9 \
            --distribution-type bin
          chmod +x gradlew

      - name: Run unit tests
        working-directory: extracted/GridHQ
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Run lint
        working-directory: extracted/GridHQ
        shell: bash
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        working-directory: extracted/GridHQ
        env:
          GRIDHQ_KEYSTORE_PASSWORD: ${{ secrets.GRIDHQ_KEYSTORE_PASSWORD }}
          GRIDHQ_KEY_ALIAS: ${{ secrets.GRIDHQ_KEY_ALIAS }}
          GRIDHQ_KEY_PASSWORD: ${{ secrets.GRIDHQ_KEY_PASSWORD }}
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Reserve disk space for Android emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "WARNING: /dev/kvm missing"

      - name: Cache Android virtual device
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-ubuntu24-api29-default-x86_64-nexusone-v2

      - name: Create clean AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus One
          avd-name: gridhq-api29
          force-avd-creation: true
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Clean AVD snapshot prepared."

      - name: Test migrations and navigation on Android
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GRIDHQ_KEYSTORE_PASSWORD: ${{ secrets.GRIDHQ_KEYSTORE_PASSWORD }}
          GRIDHQ_KEY_ALIAS: ${{ secrets.GRIDHQ_KEY_ALIAS }}
          GRIDHQ_KEY_PASSWORD: ${{ secrets.GRIDHQ_KEY_PASSWORD }}
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: Nexus One
          avd-name: gridhq-api29
          force-avd-creation: false
          disk-size: 2048M
          ram-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: extracted/GridHQ
          script: |
            ./gradlew --no-daemon connectedDebugAndroidTest --stacktrace
            mkdir -p app/build/reports/screenshots
            adb pull /sdcard/Android/data/com.monoposto.championship/files/. app/build/reports/screenshots/

      - name: Package editable project with official wrapper
        run: |
          cd extracted
          zip -qr ../GridHQ-2.1-source.zip GridHQ -x '*/build/*' '*/.gradle/*' '*/local.properties'

      - name: Upload editable project
        uses: actions/upload-artifact@v4
        with:
          name: GridHQ-2.1-source
          path: GridHQ-2.1-source.zip
          if-no-files-found: error

      - name: Prepare distributable APK
        shell: bash
        run: |
          APK="extracted/GridHQ/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK" \
            "extracted/GridHQ/app/build/outputs/apk/debug/GridHQ-2.1.apk"

          ls -lh extracted/GridHQ/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GridHQ-2.1-APK
          path: extracted/GridHQ/app/build/outputs/apk/debug/GridHQ-2.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridHQ-build-reports
          path: |
            extracted/GridHQ/app/build/reports/
            extracted/GridHQ/app/schemas/
            extracted/GridHQ/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
