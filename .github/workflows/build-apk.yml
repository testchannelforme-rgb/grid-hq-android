name: Build GridHQ APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q MonopostoChampionshipManager_COMPLETE.zip -d extracted
          rm -f extracted/GridHQ/gradle/wrapper/gradle-wrapper.jar

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Configure optional existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDHQ_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDHQ_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GRIDHQ_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GRIDHQ_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ] || \
               [ -z "$KEY_ALIAS" ] || \
               [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Keystore was supplied, but one or more signing secrets are missing."
              exit 1
            fi

            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/gridhq.keystore"

            echo "GRIDHQ_KEYSTORE_PATH=$RUNNER_TEMP/gridhq.keystore" \
              >> "$GITHUB_ENV"

            echo "Existing signing key configured."
          else
            echo "::warning::No existing signing key supplied. The debug APK will use the automatically generated debug signing key."
          fi

      - name: Generate Gradle wrapper
        working-directory: extracted/GridHQ
        shell: bash
        run: |
          gradle --no-daemon wrapper \
            --gradle-version 8.9 \
            --distribution-type bin
          chmod +x gradlew

      - name: Run unit tests
        working-directory: extracted/GridHQ
        shell: bash
        run: ./gradlew --no-daemon testDebugUnitTest --stacktrace

      - name: Run lint
        working-directory: extracted/GridHQ
        shell: bash
        run: ./gradlew --no-daemon lintDebug --stacktrace

      - name: Build debug APK
        working-directory: extracted/GridHQ
        env:
          GRIDHQ_KEYSTORE_PASSWORD: ${{ secrets.GRIDHQ_KEYSTORE_PASSWORD }}
          GRIDHQ_KEY_ALIAS: ${{ secrets.GRIDHQ_KEY_ALIAS }}
          GRIDHQ_KEY_PASSWORD: ${{ secrets.GRIDHQ_KEY_PASSWORD }}
        shell: bash
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare distributable APK
        shell: bash
        run: |
          APK="extracted/GridHQ/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          cp "$APK" \
            "extracted/GridHQ/app/build/outputs/apk/debug/GridHQ-v2.apk"

          ls -lh extracted/GridHQ/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GridHQ-v2-APK
          path: extracted/GridHQ/app/build/outputs/apk/debug/GridHQ-v2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridHQ-build-reports
          path: |
            extracted/GridHQ/app/build/reports/
            extracted/GridHQ/app/schemas/
          if-no-files-found: ignore
